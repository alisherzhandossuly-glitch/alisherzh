<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Comparison Effect — Research Design</title><style>html,body{margin:0;height:100%;background:#15110e;color:#f3eee5;font-family:Arial,sans-serif}body{display:grid;place-items:center}.loading{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.65}</style></head><body><div class="loading">Loading research design…</div><script>(async()=>{try{const v='20260930-final';const files=Array.from({length:15},(_,i)=>`payload/p${String(i+1).padStart(2,'0')}.txt?v=${v}`);const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return(await r.text()).trim()}));const bin=atob(parts.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading">Failed to load site. Refresh the page.</div>';console.error(e)}})();</script></body></html>
